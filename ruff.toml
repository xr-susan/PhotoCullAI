# Ruff's *default* rule set is not stable across releases. Ruff 0.16 widened it
# from the historical E4/E7/E9/F to also include BLE, I, LOG, PERF, PLR, RUF, S,
# SIM and UP. That turned a previously clean tree into 106 findings without a
# single line of Python changing, and broke CI purely because the workflow
# installs `ruff` unpinned.
#
# Selecting the rules explicitly keeps the lint gate stable and meaningful
# regardless of which ruff version CI happens to resolve.

line-length = 88
target-version = "py310"

[lint]
select = ["E4", "E7", "E9", "F"]
