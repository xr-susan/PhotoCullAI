[pytest]
# The tests import the application as `app.*` (for example
# `from app.utils.image_utils import blur_score`) and `app/` sits at the
# repository root, but the project is not installed as a package and there was
# no pytest config at all. So nothing put the root on sys.path and collection
# died with:
#
#     ModuleNotFoundError: No module named 'app'
#
# `python -m pytest` happens to work because CPython prepends the current
# directory in that form -- which is why this only ever surfaced in CI, and why
# the command documented in CONTRIBUTING.md (`pytest tests --maxfail=1 -q`) was
# broken. Declaring the root explicitly makes both invocations work.
pythonpath = .
