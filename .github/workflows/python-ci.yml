name: Python CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        # setuptools is pre-installed in the runner's Python (79.0.1) and is
        # audited along with everything else. That version is flagged by
        # PYSEC-2026-3447 / GHSA-h35f-9h28-mq5c (MANIFEST.in exclusion bypass
        # in sdist), fixed in 83.0.0, so the dependency audit failed on a
        # package this project never declared. Upgrade it rather than muting
        # the audit.
        python -m pip install --upgrade pip "setuptools>=83.0.0"
        pip install -r requirements-minimal.txt
        # Pin the two linters to the versions pinned in .pre-commit-config.yaml.
        # Installing them unpinned means a new release can change the rules and
        # fail this job with no code change: ruff 0.16 widened its default rule
        # set and turned a clean tree into 106 findings.
        pip install pytest "black==26.5.1" "ruff==0.15.20" pip-audit pre-commit
    - name: Run formatting check
      run: |
        black --check .
    - name: Run lint
      run: |
        ruff check .
    - name: Run pre-commit hooks
      run: |
        pre-commit run --all-files
    - name: Run dependency security audit
      run: |
        pip-audit --progress=off
    - name: Run tests
      run: |
        pytest tests --maxfail=1 -q
